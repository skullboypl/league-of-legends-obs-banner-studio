access_log off;
error_log /dev/stderr warn;

# CapRover terminuje HTTPS wcześniej; przekazujemy oryginalny protokół do SSR (kanoniczne adresy).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css text/markdown application/javascript application/json application/xml image/svg+xml;

    # The Riot API key stays in the Node process and never reaches the browser.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
        proxy_connect_timeout 2s;
    }

    location = /riot.txt {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 3s;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Dokumentacja renderowana po stronie serwera (SSR) oraz pliki dla robotów SEO/AEO/GEO.
    location ~ ^/(docs(/.*)?|sitemap\.xml|robots\.txt|llms\.txt|llms-full\.txt)$ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
    }

    # Browser Source widget: client-side route, no indexing.
    location /widget {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
